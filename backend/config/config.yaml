web_server:
  host: ""

app_name: "MyWebApp"
log_level: "info"
default_language: "pl"

frontend:
  base_url: "http://localhost:5173"
  confirmation_endpoint: "/confirm_token/{token}"
  features:
    show_register_link: true
    show_reset_password_link: true

register:
  enabled: true
  expiration_days: 1

reset_password:
  enabled: true
  expiration_days: 1

email_change:
  expiration_days: 1

token:
  jwt_secret: "supersecuresecretkey"
  access_token_ttl_minutes: 10
  refresh_token_ttl_days: 30

rate_limit:
  enabled: true
  anonymous_global:
    - rate: 10
      window: 1s
    - rate: 100
      window: 1m
    - rate: 800
      window: 10m
  authorized_global:
    - rate: 15
      window: 1s
    - rate: 150
      window: 1m
    - rate: 1200
      window: 10m
  endpoints:
    register:
      - rate: 1
        window: 1s
      - rate: 3
        window: 1m
      - rate: 10
        window: 10m
    reset:
      - rate: 1
        window: 1s
      - rate: 5
        window: 1m
      - rate: 20
        window: 10m
    login:
      - rate: 1
        window: 1s
      - rate: 5
        window: 1m
      - rate: 20
        window: 10m


